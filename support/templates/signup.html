<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen flex items-center justify-center bg-gradient-to-br from-[#2a1454] to-[#3b1d6b]">

    <div class="w-full max-w-md bg-[#4b3a6b] rounded-3xl p-8 shadow-xl">

        <!-- Title -->
        <h2 class="text-white text-2xl font-bold text-center mb-6">
            Create Account
        </h2>

        <!-- Form -->
        <form id="signupForm" class="space-y-4">

            <input type="text" id="username" placeholder="Username"
                class="w-full px-4 py-3 rounded-xl bg-transparent border border-gray-400 text-white placeholder-gray-300 focus:outline-none focus:border-pink-400"
                required>

            <input type="password" id="password" placeholder="Password"
                class="w-full px-4 py-3 rounded-xl bg-transparent border border-gray-400 text-white placeholder-gray-300 focus:outline-none focus:border-pink-400"
                required>

            <select id="role"
                class="w-full px-4 py-3 rounded-xl bg-transparent border border-gray-400 text-white focus:outline-none focus:border-pink-400"
                required>
                <option value="" class="text-black">Select Role</option>
                <option value="employer" class="text-black">Employer</option>
                <option value="worker" class="text-black">Worker</option>
            </select>

            <!-- Button -->
            <button type="submit"
                class="w-full bg-pink-500 hover:bg-pink-600 text-white py-3 rounded-xl font-semibold mt-2">
                Sign Up
            </button>
        </form>

        <!-- Login Link -->
        <p class="text-center mt-4 text-gray-200 text-sm">
            Already have an account?
            <a href="/login" class="font-semibold text-white hover:underline">
                Login
            </a>
        </p>

        <!-- Message -->
        <div id="msg" class="mt-4 text-center text-sm"></div>

    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const payload = {
                username: document.getElementById("username").value,
                password: document.getElementById("password").value,
                role: document.getElementById("role").value
            };

            const res = await fetch("/signup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            const msg = document.getElementById("msg");

            if (res.ok) {
                msg.innerHTML = "<span class='text-green-400'>Signup successful! Redirecting...</span>";
                setTimeout(() => window.location.href = "/login", 1200);
            } else {
                msg.innerHTML = `<span class='text-red-400'>${data.error}</span>`;
            }
        });
    </script>

</body>
</html>
