<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SafeHire Jobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#0B1020] via-[#24124D] to-[#6B21A8] text-white">

  <header class="sticky top-0 z-50 bg-black/20 backdrop-blur-xl border-b border-white/10"> 

    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-3"> 

     <div class="flex items-center gap-3"> 

        <img  

          src="/static/images/SafeHire_logo.png" 

          alt="SafeHire Logo" 

          class="h-12 w-12 rounded-full shadow-lg" 

        />  

        <div> 

          <p class="font-bold text-xl leading-5 text-white">SafeHire</p> 

          <p class="text-xs text-gray-300 mt-1">AI Powered Service Hiring Platform</p> 

        </div> 

      </div>
Write to CSE299||MSRB||Group07


    <div class="flex gap-4">

      <a href="/transactions"
         class="bg-blue-500 px-4 py-2 rounded-xl text-sm font-semibold hover:opacity-90">
        Transactions
      </a>

      <a href="/post-job"
         class="bg-pink-500 px-4 py-2 rounded-xl text-sm font-semibold hover:opacity-90">
        Post Job
      </a>

      <a href="/logout"
         class="bg-purple-500 px-4 py-2 rounded-xl text-sm font-semibold hover:opacity-90">
        Logout
      </a>

    </div>
  </div>

  <div class="max-w-6xl mx-auto px-6 py-6">
    <h2 class="text-3xl font-bold mb-6">Jobs & Smart Matching</h2>
    <div id="jobsContainer" class="grid md:grid-cols-2 gap-6"></div>
  </div>

  <script>

    function getJobStatusBadge(status) {
      const value = (status || "").toLowerCase();

      if (value === "open") {
        return `
          <span class="text-sm px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300">
            Open
          </span>
        `;
      }

      if (value === "assigned") {
        return `
          <span class="text-sm px-3 py-1 rounded-full bg-pink-500/20 text-pink-300">
            Assigned
          </span>
        `;
      }

      return `
        <span class="text-sm px-3 py-1 rounded-full bg-white/10 text-white/80">
          ${status || "Unknown"}
        </span>
      `;
    }

    function getHireButton(jobId, workerId, jobStatus) {
      if ((jobStatus || "").toLowerCase() !== "open") {
        return `
          <button
            disabled
            class="mt-3 w-full bg-gray-500 py-2 rounded-lg text-sm font-semibold cursor-not-allowed opacity-70">
            Already Assigned
          </button>
        `;
      }

      return `
        <button
          onclick="hire(${jobId}, ${workerId})"
          class="mt-3 w-full bg-green-500 py-2 rounded-lg text-sm font-semibold hover:opacity-90">
          Hire
        </button>
      `;
    }

    function renderRating(rating) {
      const value = Number(rating ?? 0).toFixed(1);
      return `<span class="text-yellow-300 font-semibold">⭐ ${value}</span>`;
    }

    async function loadJobs() {
      try {
        const res = await fetch("/job_matches", {
          credentials: "include"
        });
        const jobs = await res.json();
        console.log(jobs);

        const container = document.getElementById("jobsContainer");
        container.innerHTML = "";

        if (!Array.isArray(jobs) || jobs.length === 0) {
          container.innerHTML = `
            <div class="col-span-full bg-white/10 backdrop-blur p-6 rounded-2xl border border-white/10 text-white/70">
              No jobs found.
            </div>
          `;
          return;
        }

        jobs.forEach(job => {
          const workers = job.top_matches || [];

          let workerHTML = workers.length
            ? workers.map(w => `
              <div class="bg-white/10 p-4 rounded-xl border border-white/10">
                <div class="flex justify-between items-start gap-3">
                  <div>
                    <p class="font-semibold text-lg">${w.worker_name}</p>
                    <p class="text-sm text-gray-300 mt-1">${w.skills}</p>
                    <p class="text-sm text-white/70 mt-1">Experience: ${w.experience ?? 4} years</p>
                    <p class="text-sm mt-1">${renderRating(w.rating)}</p>
                  </div>

                  <div class="text-right">
                    <p class="text-pink-400 font-bold text-lg">${w.score}</p>
                    <p class="text-xs text-white/60">Match Score</p>
                  </div>
                </div>

                ${getHireButton(job.job_id, w.worker_id, job.status)}
              </div>
            `).join("")
            : `<p class="text-gray-400 text-sm">No match found</p>`;

          container.innerHTML += `
            <div class="bg-white/10 backdrop-blur p-5 rounded-2xl border border-white/10 shadow-lg">
              <div class="flex justify-between items-start gap-4">
                <div>
                  <h3 class="text-xl font-bold">${job.job_title}</h3>
                  <p class="text-sm text-gray-300">${job.job_category} • ${job.job_location}</p>
                </div>
                ${getJobStatusBadge(job.status)}
              </div>

              <p class="mt-3 text-lg font-semibold">BDT ${job.budget}</p>

              <div class="mt-4 space-y-3">
                ${workerHTML}
              </div>
            </div>
          `;
        });

      } catch (error) {
        document.getElementById("jobsContainer").innerHTML = `
          <div class="col-span-full bg-white/10 backdrop-blur p-6 rounded-2xl border border-white/10 text-red-300">
            Failed to load jobs.
          </div>
        `;
      }
    }

    async function hire(jobId, workerId) {
      try {
        const res = await fetch("/hire", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ job_id: jobId, worker_id: workerId })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || "Failed to hire worker");
          return;
        }

        alert("Worker hired successfully!");
        loadJobs();

      } catch (error) {
        alert("Something went wrong");
      }
    }

    loadJobs();

  </script>

</body>
</html>
