<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeHire-add worker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui"]
          },
          colors: {
            brand: {
              50: "#F5D0FE",
              100: "#F0ABFC",
              500: "#EC4899",
              600: "#DB2777",
              700: "#BE185D"
            }
          },
          boxShadow: {
            glow: "0 0 40px rgba(236,72,153,0.25)"
          }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen font-sans text-white bg-gradient-to-br from-[#0B1020] via-[#24124D] to-[#6B21A8]">

  <header class="sticky top-0 z-50 bg-black/30 backdrop-blur border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="/static/images/SafeHire_logo.png" alt="Logo"
          class="h-12 w-12 rounded-full shadow-lg" />
        <div>
          <p class="font-semibold text-white">SafeHire</p>
          <p class="text-xs text-gray-300">AI Powered Hiring Platform</p>
        </div>
      </div>

      <nav class="hidden md:flex items-center gap-6 text-sm text-gray-300 w-full">
        <a class="hover:text-white" href="/">Home</a>

        {% if username %}
          {% if role == "admin" %}
            <a href="/worker-dashboard">Workers</a>
            <a href="/verify-workers">Verify</a>
            <a href="/transactions">Transactions</a>
          {% elif role == "worker" %}
            <a href="/worker-dashboard">Dashboard</a>
          {% endif %}

          <div class="flex items-center gap-3 ml-auto">
            <span>Hi, {{ username }}</span>
            <a href="/logout" class="px-4 py-2 bg-purple-500 rounded-xl text-white">Logout</a>
          </div>

        {% else %}
          <div class="ml-auto flex gap-3">
            <a href="/login" class="px-4 py-2 bg-pink-500 rounded-xl text-white">Login</a>
          </div>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="max-w-3xl mx-auto rounded-[32px] border border-white/10 bg-white/5 backdrop-blur-xl p-8 shadow-2xl">

      <h1 class="text-4xl font-extrabold mb-6">Create Your Profile</h1>

      <form id="workerForm" class="space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


          <div>
            <label class="block mb-2">Full Name</label>
            <input type="text" id="name" required
              class="w-full h-12 px-4 rounded-2xl bg-white/10 border border-white/10 text-white" />
          </div>

          <div>
            <label class="block mb-2">NID</label>
            <input type="text" id="nid" required
              class="w-full h-12 px-4 rounded-2xl bg-white/10 border border-white/10 text-white" />
          </div>

          <div>
            <label class="block mb-2">Phone</label>
            <input type="text" id="phone" required
              class="w-full h-12 px-4 rounded-2xl bg-white/10 border border-white/10 text-white" />
          </div>

          <div>
            <label class="block mb-2">Address</label>
            <input type="text" id="address" required
              class="w-full h-12 px-4 rounded-2xl bg-white/10 border border-white/10 text-white" />
          </div>

          <div>
            <label class="block mb-2">Experience (Years)</label>
            <input type="number" id="experience" min="0" required
              class="w-full h-12 px-4 rounded-2xl bg-white/10 border border-white/10 text-white" />
          </div>

          <div>
            <label class="block mb-2">Profession</label>
            <input type="text" id="profession" required
              placeholder="Electrician"
              class="w-full h-12 px-4 rounded-2xl bg-white/10 border border-white/10 text-white" />
          </div>

          <div>
            <label class="block mb-2">Skills</label>
            <input type="text" id="skills" required
              placeholder="Wiring, Fan repair, Switch repair"
              class="w-full h-12 px-4 rounded-2xl bg-white/10 border border-white/10 text-white" />
          </div>

        </div>

        <button type="submit"
          class="px-6 py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-500 font-semibold">
          Create Profile
        </button>

        <div id="formMessage" class="text-sm mt-3"></div>

      </form>
    </div>
  </main>

<script>
  document.getElementById("workerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = {
      name: document.getElementById("name").value.trim(),
      nid: document.getElementById("nid").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      address: document.getElementById("address").value.trim(),
      profession: document.getElementById("profession").value.trim(),
      skills: document.getElementById("skills").value.trim(),
      experience: document.getElementById("experience").value.trim()
    };

    const msg = document.getElementById("formMessage");

    try {
      const res = await fetch("/add_worker", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (res.ok) {
        msg.innerHTML = "<span class='text-green-400'>Worker profile created successfully! Redirecting...</span>";

        setTimeout(() => {
          window.location.href = "/worker-dashboard";
        }, 1200);

      } else {
        msg.innerHTML = `<span class='text-red-400'>${data.error}</span>`;
      }

    } catch (error) {
      msg.innerHTML = `<span class='text-red-400'>Server error</span>`;
    }
  });
</script>

</body>
</html>
