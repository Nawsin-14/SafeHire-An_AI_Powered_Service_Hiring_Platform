<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - SafeHire</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-[#0B1020] via-[#24124D] to-[#6B21A8] min-h-screen flex items-center justify-center text-white">

    <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/10 rounded-3xl p-8 shadow-2xl">
        <h1 class="text-4xl font-bold text-center mb-2">Admin Login</h1>

        <form id="adminLoginForm" class="space-y-5">
            <div>
                <label class="block mb-2 text-sm text-white/400">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter admin username"
                    class="w-full px-5 py-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none focus:border-pink-400"
                    required
                />
            </div>

            <div>
                <label class="block mb-2 text-sm text-white/400">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter shared admin password"
                    class="w-full px-5 py-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none focus:border-pink-400"
                    required
                />
            </div>

            <button
                type="submit"
                class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 text-white font-semibold py-4 rounded-2xl transition"
            >
                Login as Admin
            </button>
        </form>

        <p class="text-center text-white/70 mt-6">
            Back to
            <a href="/" class="font-semibold text-white hover:text-pink-300">Home</a>
        </p>
    </div>

    <div id="messageModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="w-full max-w-md bg-gradient-to-br from-[#24124D] to-[#6B21A8] border border-white/10 rounded-3xl shadow-2xl p-6 text-white">
            <div class="flex items-start gap-4">
                <div id="modalIcon" class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl font-bold bg-rose-500/20 text-rose-300 border border-rose-400/30">
                    !
                </div>

                <div class="flex-1">
                    <h2 id="modalTitle" class="text-2xl font-bold mb-2">Login Failed</h2>
                    <p id="modalMessage" class="text-white/80 leading-relaxed">
                        Invalid admin credentials
                    </p>
                </div>
            </div>

            <div class="mt-6 flex justify-end">
                <button
                    id="modalOkBtn"
                    class="bg-pink-500 hover:bg-pink-600 text-white font-semibold px-6 py-3 rounded-2xl transition"
                >
                    OK
                </button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("adminLoginForm");
        const modal = document.getElementById("messageModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalMessage = document.getElementById("modalMessage");
        const modalIcon = document.getElementById("modalIcon");
        const modalOkBtn = document.getElementById("modalOkBtn");

        function showModal(type, message) {
            if (type === "error") {
                modalTitle.textContent = "Login Failed";
                modalMessage.textContent = message;
                modalIcon.textContent = "!";
                modalIcon.className =
                    "w-14 h-14 rounded-2xl flex items-center justify-center text-2xl font-bold bg-rose-500/20 text-rose-300 border border-rose-400/30";
            }

            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeModal() {
            modal.classList.remove("flex");
            modal.classList.add("hidden");
        }

        modalOkBtn.addEventListener("click", closeModal);

        modal.addEventListener("click", function (e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const payload = {
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value.trim()
            };

            try {
                const res = await fetch("/admin-login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.href = data.redirect || "/admin-dashboard";
                } else {
                    showModal("error", data.error || "Invalid admin login");
                }
            } catch (error) {
                showModal("error", "Something went wrong. Please try again.");
            }
        });
    </script>
</body>
</html>
