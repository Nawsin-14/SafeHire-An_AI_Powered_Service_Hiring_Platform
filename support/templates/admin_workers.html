<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeHire All Workers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui"]
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen font-sans text-white bg-gradient-to-br from-[#0B1020] via-[#24124D] to-[#6B21A8]"></body>

  <header class="bg-white/10 backdrop-blur border-b border-white/10"></header>
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-extrabold">SafeHire Admin</h1>
      </div>

      <div class="flex items-center gap-3">
        <span class="text-sm text-slate-600">
          Logged in as <span class="font-semibold">{{ username }}</span>
        </span>
        <a href="/logout"
           class="inline-flex items-center rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 transition">
          Logout
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="bg-white/10 backdrop-blur border border-white/10 rounded-2xl shadow-lg overflow-hidden"></div>
      <div class="px-6 py-5 border-b border-white/10 flex items-center justify-between">
        <div>
          <h2 class="text-xl font-bold">Workers List</h2>
        </div>

        <button onclick="loadWorkers()"
                class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700 transition">
          Refresh
        </button>
      </div>

      <div id="loading" class="px-6 py-6 text-slate-500">
        Loading workers...
      </div>

<div class="overflow-x-auto">
  <table class="min-w-full hidden text-white" id="workersTable">
    
    
    <thead class="bg-white/10 backdrop-blur">
      <tr class="text-left text-sm text-white/70">
        <th class="px-6 py-4 font-semibold">ID</th>
        <th class="px-6 py-4 font-semibold">Name</th>
        <th class="px-6 py-4 font-semibold">NID</th>
        <th class="px-6 py-4 font-semibold">Phone</th>
        <th class="px-6 py-4 font-semibold">Address</th>
        <th class="px-6 py-4 font-semibold">Skills</th>
        <th class="px-6 py-4 font-semibold text-center">Experience</th>
        <th class="px-6 py-4 font-semibold text-center">Rating</th>
        <th class="px-6 py-4 font-semibold text-center">Risk Score</th>
        <th class="px-6 py-4 font-semibold text-center">Status</th>
        <th class="px-6 py-4 font-semibold text-center">Actions</th>
      </tr>
    </thead>


    <tbody id="workersBody" class="divide-y divide-white/10"></tbody>

  </table>
</div>

      <div id="emptyState" class="hidden px-6 py-10 text-center text-slate-500">
        No workers found.
      </div>
    </div>
  </main>

  <script>
    function getStatusBadge(status) {
      const value = (status || "").toLowerCase();

      if (value === "verified") {
        return `<span class="inline-flex rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-700">Verified</span>`;
      }

      if (value === "rejected") {
        return `<span class="inline-flex rounded-full bg-rose-100 px-3 py-1 text-xs font-semibold text-rose-700">Rejected</span>`;
      }

      return `<span class="inline-flex rounded-full bg-amber-100 px-3 py-1 text-xs font-semibold text-amber-700">Pending</span>`;
    }

    async function updateWorkerStatus(workerId, status) {
      try {
        const res = await fetch(`/verify_worker/${workerId}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ status })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || "Failed to update worker status");
          return;
        }

        alert(data.message || "Status updated successfully");
        loadWorkers();
      } catch (error) {
        alert("Something went wrong while updating worker status");
      }
    }

    async function loadWorkers() {
      const loading = document.getElementById("loading");
      const table = document.getElementById("workersTable");
      const tbody = document.getElementById("workersBody");
      const emptyState = document.getElementById("emptyState");

      loading.classList.remove("hidden");
      table.classList.add("hidden");
      emptyState.classList.add("hidden");
      tbody.innerHTML = "";

      try {
        const response = await fetch("/workers");
        const workers = await response.json();

        loading.classList.add("hidden");

        if (!Array.isArray(workers) || workers.length === 0) {
          emptyState.classList.remove("hidden");
          return;
        }

        table.classList.remove("hidden");

        workers.forEach(worker => {
          const row = document.createElement("tr");
          row.className = "hover:bg-white/5";

          row.innerHTML = `
            <td class="px-6 py-4 text-sm">${worker.id ?? ""}</td>
            <td class="px-6 py-4 text-sm font-semibold">${worker.name ?? ""}</td>
            <td class="px-6 py-4 text-sm">${worker.nid ?? ""}</td>
            <td class="px-6 py-4 text-sm">${worker.phone ?? ""}</td>
            <td class="px-6 py-4 text-sm">${worker.address ?? ""}</td>
            <td class="px-6 py-4 text-sm">${worker.skills ?? ""}</td>
            <td class="px-6 py-4 text-sm">${worker.experience ?? 0} years</td>
            <td class="px-6 py-4 text-sm">${worker.rating ?? 0}</td>
            <td class="px-6 py-4 text-sm">${worker.risk_score ?? 0}</td>
            <td class="px-6 py-4 text-sm">${getStatusBadge(worker.verification_status)}</td>
            <td class="px-6 py-4 text-sm">
                <div class="flex justify-center gap-2">
                    <button class="bg-gradient-to-r from-pink-500 to-purple-600 px-3 py-1 rounded text-xs text-white hover:opacity-90">
                       Verify
                    </button>

                    <button 
                     class="bg-gradient-to-r from-pink-500 to-purple-600 px-3 py-1 rounded text-xs text-white opacity-80 hover:opacity-100">
                      Reject
                    </button>
                    <button class="bg-gradient-to-r from-pink-500 to-purple-600 px-3 py-1 rounded text-xs text-white opacity-60 hover:opacity-100">
                      Pending
                    </button>
                </div>
            </td>
          `;

          tbody.appendChild(row);
        });

      } catch (error) {
        loading.textContent = "Failed to load workers.";
      }
    }

    loadWorkers();
  </script>
</body>
</html>
