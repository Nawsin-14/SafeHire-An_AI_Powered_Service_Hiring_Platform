<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeHire Transactions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui"]
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen font-sans text-white bg-gradient-to-br from-[#0B1020] via-[#24124D] to-[#6B21A8]">

  <header class="bg-white/10 backdrop-blur border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-extrabold">SafeHire Transactions</h1>
      </div>

      <div class="flex items-center gap-3">
        <a href="/admin-dashboard"
           class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-sm font-semibold transition">
          Dashboard
        </a>
        <a href="/logout"
           class="bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 px-4 py-2 rounded-lg text-sm font-semibold text-white transition">
          Logout
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    
    <section class="mb-6">
      <div class="bg-white/10 backdrop-blur border border-white/10 rounded-2xl p-6 shadow-lg">
        <h2 class="text-xl font-bold mb-2">Transactions Overview</h2>
      </div>
    </section>

    <section>
      <div class="bg-white/10 backdrop-blur border border-white/10 rounded-2xl shadow-lg overflow-hidden">
        
        <div class="px-6 py-5 border-b border-white/10 flex items-center justify-between">
          <div>
            <h2 class="text-xl font-bold">All Transactions</h2>
            <p class="text-sm text-white/70">Hiring history and assigned payment records</p>
          </div>

          <button onclick="loadTransactions()"
                  class="bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 px-4 py-2 rounded-lg text-sm font-semibold text-white transition">
            Refresh
          </button>
        </div>

        <div id="loading" class="px-6 py-6 text-white/70">
          Loading transactions...
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full hidden text-white" id="transactionsTable">
            <thead class="bg-white/10">
              <tr class="text-left text-sm text-white/70">
                <th class="px-6 py-4 font-semibold">ID</th>
                <th class="px-6 py-4 font-semibold">Employer</th>
                <th class="px-6 py-4 font-semibold">Worker</th>
                <th class="px-6 py-4 font-semibold">Job Title</th>
                <th class="px-6 py-4 font-semibold">Location</th>
                <th class="px-6 py-4 font-semibold text-center">Amount</th>
                <th class="px-6 py-4 font-semibold text-center">Status</th>
                <th class="px-6 py-4 font-semibold">Created At</th>
              </tr>
            </thead>
            <tbody id="transactionsBody" class="divide-y divide-white/10"></tbody>
          </table>
        </div>

        <div id="emptyState" class="hidden px-6 py-10 text-center text-white/70">
          No transactions found
        </div>
      </div>
    </section>
  </main>

  <script>
    function getStatusBadge(status) {
      const value = (status || "").toLowerCase();

      if (value === "assigned") {
        return `<span class="inline-flex rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-700">Assigned</span>`;
      }

      if (value === "completed") {
        return `<span class="inline-flex rounded-full bg-blue-100 px-3 py-1 text-xs font-semibold text-blue-700">Completed</span>`;
      }

      if (value === "cancelled") {
        return `<span class="inline-flex rounded-full bg-rose-100 px-3 py-1 text-xs font-semibold text-rose-700">Cancelled</span>`;
      }

      return `<span class="inline-flex rounded-full bg-amber-100 px-3 py-1 text-xs font-semibold text-amber-700">${status || "Unknown"}</span>`;
    }

    async function loadTransactions() {
      const loading = document.getElementById("loading");
      const table = document.getElementById("transactionsTable");
      const tbody = document.getElementById("transactionsBody");
      const emptyState = document.getElementById("emptyState");

      loading.classList.remove("hidden");
      table.classList.add("hidden");
      emptyState.classList.add("hidden");
      tbody.innerHTML = "";

      try {
        const response = await fetch("/transactions_api");
        const transactions = await response.json();

        loading.classList.add("hidden");

        if (!Array.isArray(transactions) || transactions.length === 0) {
          emptyState.classList.remove("hidden");
          return;
        }

        table.classList.remove("hidden");

        transactions.forEach(transaction => {
          const row = document.createElement("tr");
          row.className = "hover:bg-white/5 transition";

          row.innerHTML = `
            <td class="px-6 py-4 text-sm">${transaction.id ?? ""}</td>
            <td class="px-6 py-4 text-sm font-medium">${transaction.employer_name ?? ""}</td>
            <td class="px-6 py-4 text-sm font-medium">${transaction.worker_name ?? ""}</td>
            <td class="px-6 py-4 text-sm">${transaction.job_title ?? ""}</td>
            <td class="px-6 py-4 text-sm">${transaction.location ?? ""}</td>
            <td class="px-6 py-4 text-sm text-center">৳${transaction.amount ?? 0}</td>
            <td class="px-6 py-4 text-sm text-center">${getStatusBadge(transaction.status)}</td>
            <td class="px-6 py-4 text-sm">${transaction.created_at ?? ""}</td>
          `;

          tbody.appendChild(row);
        });

      } catch (error) {
        loading.textContent = "Failed to load transactions.";
      }
    }

    loadTransactions();
  </script>
</body>
</html>
