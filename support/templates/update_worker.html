<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Worker Profile - SafeHire</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-[#0B1020] via-[#24124D] to-[#6B21A8] min-h-screen text-white">

    <div class="max-w-4xl mx-auto py-12 px-6">
        <div class="bg-white/10 backdrop-blur-lg border border-white/10 rounded-3xl p-10 shadow-2xl">
            <h1 class="text-3xl font-bold mb-2">Update Profile</h1>
            <p class="text-white/70 mb-8">Edit your worker profile information</p>

            <form id="updateWorkerForm" class="space-y-6">
                <div>
                    <label class="block mb-2 text-sm text-white/80">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        value="{{ worker.name }}"
                        class="w-full px-5 py-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none focus:border-pink-400"
                        required
                    />
                </div>

                <div>
                    <label class="block mb-2 text-sm text-white/80">Phone</label>
                    <input
                        type="text"
                        id="phone"
                        value="{{ worker.phone }}"
                        class="w-full px-5 py-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none focus:border-pink-400"
                        required
                    />
                </div>

                <div>
                    <label class="block mb-2 text-sm text-white/80">Address</label>
                    <input
                        type="text"
                        id="address"
                        value="{{ worker.address }}"
                        class="w-full px-5 py-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none focus:border-pink-400"
                        required
                    />
                </div>

                <div>
                    <label class="block mb-2 text-sm text-white/80">Skills</label>
                    <input
                        type="text"
                        id="skills"
                        value="{{ worker.skills }}"
                        class="w-full px-5 py-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none focus:border-pink-400"
                        required
                    />
                </div>

                <div>
                    <label class="block mb-2 text-sm text-white/80">Profession</label>
                    <input
                        type="text"
                        id="profession"
                        value="{{ worker.profession }}"
                        class="w-full px-5 py-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none focus:border-pink-400"
                        required
                    />
                </div>

                <div>
                    <label class="block mb-2 text-sm text-white/80">Experience (Years)</label>
                    <input
                        type="number"
                        id="experience"
                        value="{{ worker.experience }}"
                        class="w-full px-5 py-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none focus:border-pink-400"
                        required
                    />
                </div>

                <div class="flex gap-4 pt-4">
                    <button
                        type="submit"
                        class="bg-pink-500 hover:bg-pink-600 px-8 py-3 rounded-2xl font-semibold transition"
                    >
                        Save Changes
                    </button>

                    <a
                        href="/worker-dashboard"
                        class="bg-white/10 hover:bg-white/20 px-8 py-3 rounded-2xl font-semibold transition"
                    >
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>


    <div id="messageModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="w-full max-w-md bg-gradient-to-br from-[#24124D] to-[#6B21A8] border border-white/10 rounded-3xl shadow-2xl p-6 text-white">
            <div class="flex items-start gap-4">
                <div id="modalIcon" class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">
                    ✓
                </div>

                <div class="flex-1">
                    <h2 id="modalTitle" class="text-2xl font-bold mb-2">Success</h2>
                    <p id="modalMessage" class="text-white/80 leading-relaxed">
                        Profile updated successfully.
                    </p>
                </div>
            </div>

            <div class="mt-6 flex justify-end">
                <button
                    id="modalOkBtn"
                    class="bg-pink-500 hover:bg-pink-600 text-white font-semibold px-6 py-3 rounded-2xl transition"
                >
                    OK
                </button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("updateWorkerForm");
        const modal = document.getElementById("messageModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalMessage = document.getElementById("modalMessage");
        const modalIcon = document.getElementById("modalIcon");
        const modalOkBtn = document.getElementById("modalOkBtn");

        let redirectUrl = null;

        function showModal(type, message, redirect = null) {
            redirectUrl = redirect;

            if (type === "success") {
                modalTitle.textContent = "Profile Updated";
                modalMessage.textContent = message || "Your profile has been updated successfully.";
                modalIcon.textContent = "✓";
                modalIcon.className =
                    "w-14 h-14 rounded-2xl flex items-center justify-center text-2xl font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30";
            } else {
                modalTitle.textContent = "Update Failed";
                modalMessage.textContent = message || "Something went wrong while updating your profile.";
                modalIcon.textContent = "!";
                modalIcon.className =
                    "w-14 h-14 rounded-2xl flex items-center justify-center text-2xl font-bold bg-rose-500/20 text-rose-300 border border-rose-400/30";
            }

            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeModal() {
            modal.classList.remove("flex");
            modal.classList.add("hidden");

            if (redirectUrl) {
                window.location.href = redirectUrl;
            }
        }

        modalOkBtn.addEventListener("click", closeModal);

        modal.addEventListener("click", function (e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const payload = {
                name: document.getElementById("name").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                address: document.getElementById("address").value.trim(),
                skills: document.getElementById("skills").value.trim(),
                profession: document.getElementById("profession").value.trim(),
                experience: document.getElementById("experience").value.trim()
            };

            try {
                const res = await fetch("/update_worker", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    showModal("success", data.message || "Profile updated successfully", data.redirect || "/worker-dashboard");
                } else {
                    showModal("error", data.error || "Failed to update profile");
                }
            } catch (error) {
                showModal("error", "Something went wrong. Please try again.");
            }
        });
    </script>
</body>
</html>
