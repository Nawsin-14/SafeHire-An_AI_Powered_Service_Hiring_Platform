<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SafeHire Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#0B1020] via-[#24124D] to-[#6B21A8] text-white">

  <div class="bg-white/10 backdrop-blur p-8 rounded-3xl w-80 shadow-xl">
    <h2 class="text-2xl font-bold text-center mb-6">SafeHire Login</h2>

    <form id="loginForm" class="space-y-4">
      <input name="username" placeholder="Username"
        class="w-full p-3 rounded-xl bg-white/10 border border-white/20 placeholder-gray-300 
        focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition"
        required>

      <input name="password" type="password" placeholder="Password"
        class="w-full p-3 rounded-xl bg-white/10 border border-white/20 placeholder-gray-300 
        focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition"
        required>

      <button type="submit"
       class="w-full py-3 bg-pink-500 rounded-xl font-semibold hover:bg-pink-600 transition duration-200 shadow-md">
        Login
      </button>
      <p class="text-center mt-4 text-sm text-gray-200">
        Don’t have an account?
        <a href="/signup" class="font-semibold text-white hover:underline">
          Create account
       </a>
     </p>
    </form>

     <div id="msg" class="text-center text-sm mt-4"></div>
  </div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const formData = new FormData(this);
  const data = Object.fromEntries(formData.entries());
  const msg = document.getElementById("msg");
  msg.innerHTML = "Logging in...";

  const res = await fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if (!res.ok) {
    msg.innerHTML = `<span class="text-red-400">${result.error}</span>`;
    return;
  }

  msg.innerHTML = `<span class="text-green-400">Login successful! Redirecting...</span>`;
  setTimeout(() => {
    if (result.redirect) {
      window.location.href = result.redirect;
    } else {
  if (result.role === "admin") {
    window.location.href = "/verify-workers";
  } else if (result.role === "worker") {
    window.location.href = "/worker-dashboard";
  } else {
    window.location.href = "/jobs";
  }
}
}, 800);
});
</script>
</body>
</html>
